preprocess:
#TODO: window的计算参数调整（向内缩进的范围）
  profile: pair_1120_1208
  seed: 42
  output_base_dir: data/1120_dvctest
  steps: 123456
  dataset_pairs:
  - image_root: datasets/images/1120
    label_root: datasets/labels/1120
  # - image_root: datasets/images/1208
  #   label_root: datasets/labels/1208
# 数据集需要按labelme保存
#  - image_root: datasets/images/nocrack
#    label_root: datasets/labels/nocrack
#  - image_root: /datasets/PAR/Xray/opensource/SWRDdvcpipeline/images/swrd8bit_crop
#    label_root: /datasets/PAR/Xray/opensource/SWRDdvcpipeline/labels/swrd8bit_crop
  labelme2yolo:
    seg: true
    unify_to_crack: false
    val_manifest: datasets/labels/1120/val_manifest.json
  yolo_roi_extractor:
    model_path: ./model/weldROI4.pt
    roi_conf: 0.25
    roi_iou: 0.45
    padding: 0.1
    mode: seg
  patchandenhance:
    overlap: 0.5
    enhance_mode: windowing
    slice_mode: 2
    window_size:
    - 880
    - 880
    label_mode: seg
  seg2det:
    mode: det
    balance_data: false
    balance_ratio: 1.0
  yolo2coco:
    task: det
    test_split_ratio: 0.05
    split_seed: 42
  merge_coco:
    dataset_b: roi2_merge/coco_det
    splits:
    - train
    - valid
    - test
    merge_ratio:
    - 1.0
rfdetr:
  dataset_dir: "${preprocess.output_base_dir}/coco_from_patch"
  output_dir: outputs/rfdetr
  run: 1120_SWRD_resumePatch
  resume: model/0208primary.pth
  resolution: 840
  class_names:
  - 其他
  - 内凹
  - 咬边
  - 圆形缺陷
  - 未焊透
  - 未熔合
  - 条形缺陷
  - 裂纹
  num_classes: 8
  epochs: 500
  batch_size: 4
  grad_accum_steps: 8
  lr: 0.0001
  early_stopping: true
  metrics_path: metrics/rfdetr.json
  keep_best_only: true
data:
  tag: crack_v1
  raw_dir: datasets/crack/crack
  yolo_dir: data/processed/crack_yolo
  val_size: 0.1

train:
  epochs: 200
  imgsz: 640
  batch: 32
  lr: 0.001
  output_dir: outputs/welddetect
  run: crack_baseline
  model: yolo11l.pt
  pretrained: true
  degrees: 180
