schema: '2.0'
stages:
  preprocess_crack:
    cmd: python convert/labelme2yolo.py --json_dir datasets/crack/crack 
      --image_dir datasets/crack/crack --val_size 0.1 --output_dir 
      data/processed/crack_yolo
    deps:
    - path: convert/labelme2yolo.py
      hash: md5
      md5: d9f6957586d48becd4cc2dd804c7ebf5
      size: 24585
    - path: datasets/crack/crack
      hash: md5
      md5: c2459b620544478dcb4a2d0f9da007be.dir
      size: 3623680667
      nfiles: 1125
    params:
      params.yaml:
        data.raw_dir: datasets/crack/crack
        data.tag: crack_v1
        data.val_size: 0.1
        data.yolo_dir: data/processed/crack_yolo
    outs:
    - path: data/processed/crack_yolo
      hash: md5
      md5: 3925e0eeb6fb0b1e8a78713faf5ee3fb.dir
      size: 2452986172
      nfiles: 1125
  preprocess_all:
    cmd: python run_data_pipeline.py --config-path 
      configs/pipeline_profiles_new.yaml --profile pair_1120_1208 --params-path 
      params.yaml --steps 123456 --seed 42
    deps:
    - path: configs/pipeline_profiles_new.yaml
      hash: md5
      md5: d3372d9e245001a144fb0fc04125d562
      size: 1469
    - path: datasets/images
      hash: md5
      md5: d42300cf166cd8679895f4eb2b03e3f8.dir
      size: 9851960588
      nfiles: 3723
    - path: datasets/labels
      hash: md5
      md5: b27ec87dc922ea9f37d20202eba77586.dir
      size: 2178623780
      nfiles: 2344
    - path: params.yaml
      hash: md5
      md5: 388d316a10d1750609e702d5051f1b18
      size: 1960
    - path: run_data_pipeline.py
      hash: md5
      md5: 7b62649090b6775688658b2adaa65ab8
      size: 39729
    params:
      params.yaml:
        preprocess:
          profile: pair_1120_1208
          seed: 42
          output_base_dir: data/dvctest
          steps: 123456
          dataset_pairs:
          - image_root: datasets/images/1120
            label_root: datasets/labels/1120
          - image_root: datasets/images/1208
            label_root: datasets/labels/1208
          labelme2yolo:
            seg: true
            unify_to_crack: false
          yolo_roi_extractor:
            model_path: ./model/weldROI4.pt
            roi_conf: 0.25
            roi_iou: 0.45
            padding: 0.1
            mode: seg
          patchandenhance:
            overlap: 0.5
            enhance_mode: windowing
            slice_mode: 2
            window_size:
            - 880
            - 880
            label_mode: seg
          seg2det:
            mode: det
            balance_data: false
            balance_ratio: 1.0
          yolo2coco:
            task: det
            test_split_ratio: 0.05
            split_seed: 42
          merge_coco:
            dataset_b: roi2_merge/coco_det
            splits:
            - train
            - valid
            - test
            merge_ratio:
            - 1.0
    outs:
    - path: data/dvctest
      hash: md5
      md5: 920e69665fb454f3ccd5ce69d7fb52fc.dir
      size: 9120583606
      nfiles: 33122
