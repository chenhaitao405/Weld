            label_mode: seg
          seg2det:
            mode: det
            balance_data: false
            balance_ratio: 1.0
          yolo2coco:
            task: det
            test_split_ratio: 0.05
            split_seed: 42
          merge_coco:
            dataset_b: roi2_merge/coco_det
            splits:
            - train
            - valid
            - test
            merge_ratio:
            - 1.0
    outs:
