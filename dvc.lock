    params:
      params.yaml:
        preprocess:
          profile: pair_1120_1208
          seed: 42
          output_base_dir: data/pipeline_pair_patch/1120
          steps: 123456
          dataset_pairs:
          - image_root: datasets/images/1120
            label_root: datasets/labels/1120
